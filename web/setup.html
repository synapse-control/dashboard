{{define "body"}}
<section class="card narrow">
  <h1>Set up Synapse Control</h1>
  <p>Make the first account. It is the admin: it can drive pins, add boards and add people.</p>
  <form method="post" action="/setup" class="stack">
    <label>Name <input name="name" autocomplete="username" required autofocus></label>
    <label>Password (10 characters or more) <input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Password again <input name="confirm" type="password" autocomplete="new-password" minlength="10" required></label>
    <button type="submit">Create the admin</button>
  </form>
</section>
{{end}}
