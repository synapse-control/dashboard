{{define "body"}}
<h1>People</h1>
<section class="card">
  <table>
    <thead><tr><th>Name</th><th>Role</th><th></th></tr></thead>
    <tbody>
    {{range .Data}}
      <tr><td>{{.Name}}</td><td>{{.Role}}</td>
      <td><form method="post" action="/users/{{.Name}}/delete"><button class="link danger" type="submit">Remove</button></form></td></tr>
    {{end}}
    </tbody>
  </table>
</section>
<section class="card">
  <h2>Add someone</h2>
  <p class="muted">A viewer sees every board and reads pins. An admin also drives pins, connects boards and adds people.</p>
  <form method="post" action="/users" class="row">
    <input name="name" placeholder="name" required>
    <input name="password" type="password" placeholder="password (10+)" minlength="10" required autocomplete="new-password">
    <select name="role"><option value="viewer">viewer</option><option value="admin">admin</option></select>
    <button type="submit">Add</button>
  </form>
</section>
{{end}}
