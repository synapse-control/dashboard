{{define "body"}}
<div class="head">
  <h1 id="title">{{.Data}}</h1>
  <span id="hub" class="pill">connecting…</span>
</div>
<div id="node" data-view="node" data-node="{{.Data}}">
  <section class="card" id="summary"><p class="muted">Waiting for the hub…</p></section>
  <section class="card">
    <div class="head"><h2>Pins</h2><span id="pins-note" class="muted"></span></div>
    <div id="pins" class="scroll"><p class="muted">Loading the board's own description…</p></div>
  </section>
  <section class="card">
    <div class="head"><h2>What is wired to it</h2><button id="survey" type="button">Survey every pin</button></div>
    <div id="survey-out"><p class="muted">The survey float-tests each pin and says what is attached. It drives no outputs.</p></div>
  </section>
  <section class="card">
    <h2>Wire log</h2>
    <pre id="wire" class="wire"></pre>
  </section>
</div>
{{end}}
